name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stack:
    # Brings up the whole PoC and waits for the web app to get database
    # credentials from Vault: that is the only thing the PoC has to prove.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 5
          done
          echo "test-api-hc never got healthy"
          exit 1
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
